on:
  push:
    branches: [main]

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'  

      - name: Install deps
        run: pip install -r tests/requirements-dev.txt

      - name: Run tests
        run: pytest tests/ -q  
